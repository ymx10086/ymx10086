      <stop stop-color="#0F766E"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="stroke" x1="24" y1="12" x2="896" y2="166" gradientUnits="userSpaceOnUse">
